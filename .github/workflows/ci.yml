name: CI

# Straight-to-main delivery: run on every push to main, not only on PRs
# (PAS-OPS-004; proappstore-online/platform#204).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  router:
    uses: serge-ivo/runner-router/.github/workflows/router.yml@v1
    with:
      included-minutes: 2000
      self-hosted-labels: self-hosted,pags
    secrets:
      billing-token: ${{ secrets.ORG_BILLING_TOKEN }}

  typecheck:
    needs: router
    runs-on: ${{ fromJSON(needs.router.outputs.runner) }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
